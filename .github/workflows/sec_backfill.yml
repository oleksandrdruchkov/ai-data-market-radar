name: SEC backfill (разово)

# Повне перезавантаження історії SEC: потрібне, коли до збирача додано нові показники
# (щоденний запуск бере лише подання за останні 45 днів).
# Запуск: Actions -> «SEC backfill (разово)» -> Run workflow. Триває ~10-15 хв.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "З якої дати брати історію"
        default: "2020-01-01"
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SEC_RECENT_DAYS: '0'
      SEC_BACKFILL_START: ${{ inputs.since }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: SEC financials (повна історія)
        run: python -m collectors.sec_financials
      - name: Funding ladder
        if: ${{ !cancelled() }}
        run: python -m metrics.funding_ladder
