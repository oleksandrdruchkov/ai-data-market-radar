name: ArXiv phrases - check

# Друкує, скільки статей минулого місяця дає кожна фраза напрямів окремо
# (collectors/arxiv_counts.py, DIRECTIONS). Нічого не пише в базу.
# Запуск: Actions -> «ArXiv phrases - check» -> Run workflow; результат - у журналі кроку.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe - які запити приймає arXiv
        run: python -m collectors.arxiv_counts --probe
      - name: Phrase counts
        run: python -m collectors.arxiv_counts --check
