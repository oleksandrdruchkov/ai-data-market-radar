name: ArXiv phrases - check

# Друкує, скільки статей минулого місяця дає кожна фраза напрямів окремо
# (collectors/arxiv_counts.py, DIRECTIONS). Нічого не пише в базу.
# Запуск: Actions -> «ArXiv phrases - check» -> Run workflow; результат - у журналі кроку.
on:
  workflow_dispatch:
    inputs:
      direction:
        description: 'Напрям (усі разом - ~115 запитів, arXiv може обмежити)'
        type: choice
        default: stems
        options: [stems, agents, ai_science, self_improvement, robots, reasoning, safety, all]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Phrase counts
        env:
          PHRASE_CHECK_DIRECTION: ${{ inputs.direction != 'all' && inputs.direction || '' }}
        run: python -m collectors.arxiv_counts --check
