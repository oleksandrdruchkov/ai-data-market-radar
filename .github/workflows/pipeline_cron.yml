name: Scheduled Data & AI Intelligence Pipeline

on:
  schedule:
    # Щоденний автоматичний запуск о 03:00 UTC
    - cron: '0 3 * * *'
  # Можливість ручного запуску з вкладки Actions у GitHub
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    # Спільні змінні для всіх кроків.
    # SUPABASE_KEY має бути ключем service_role (див. sql/002_rls_new_tables.sql).
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Необов'язково: свій каскад моделей через кому
      # GEMINI_MODELS: gemini-3.5-flash-lite,gemini-3.6-flash,gemini-3.8-flash
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (без бази)
        run: |
          pip install pytest reportlab
          python -m pytest -q tests

      # ---------- Збирачі на новому каркасі (core/) ----------
      # Кожен крок незалежний: збій одного (червоний) не зупиняє наступні.

      - name: Jobs - Adzuna (US / Europe)
        if: ${{ !cancelled() }}
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m collectors.jobs_adzuna

      - name: Jobs - DeepSeek (APAC, ручний список)
        if: ${{ !cancelled() }}
        run: python -m collectors.jobs_deepseek

      - name: ArXiv research signals
        if: ${{ !cancelled() }}
        run: python -m collectors.arxiv

      - name: Autonomy horizons + ECI (METR via Epoch)
        if: ${{ !cancelled() }}
        run: python -m collectors.epoch_horizons

      - name: System cards - leaders' actions beyond bounds (auto-verified)
        if: ${{ !cancelled() }}
        run: python -m collectors.system_cards

      # ---------- Індекс крихкості бульбашки ШІ (sql/011_bubble_metrics.sql) ----------

      - name: Bubble - FRED (спреди, ставки, вакансії Indeed)
        if: ${{ !cancelled() }}
        run: python -m collectors.fred_series

      - name: Bubble - Adzuna counts (ML vs розробники)
        if: ${{ !cancelled() }}
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m collectors.adzuna_counts

      - name: Bubble - fragility index v0 (metrics/bubble.py)
        if: ${{ !cancelled() }}
        run: python -m metrics.bubble

      # ---------- Ринкові сигнали учасників перегонів (sql/015, sql/016) ----------
      # Офіційні безкоштовні API SEC EDGAR, без Gemini.

      - name: Market - SEC financials (виручка, капвитрати, R&D)
        if: ${{ !cancelled() }}
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m collectors.sec_financials

      - name: Market - SEC filings (IPO, 8-K, 13D/G)
        if: ${{ !cancelled() }}
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m collectors.sec_filings

      # ---------- Показники ----------

      - name: Metrics - autonomy (T50 frontier, SAI_T)
        if: ${{ !cancelled() }}
        run: python -m metrics.autonomy

      # ---------- Ще не перенесені ----------

