name: Probe - DeepSeek jobs on MokaHR

# Діагностика: як сторінка вакансій DeepSeek на MokaHR отримує дані. Нічого не пише в базу.
# Запуск: Actions -> «Probe - DeepSeek jobs on MokaHR» -> Run workflow; результат - у журналі кроку.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe MokaHR
        run: python -m tools.probe_mokahr
