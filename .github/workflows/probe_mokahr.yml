name: Probe - DeepSeek jobs on MokaHR

# Діагностика: як сторінка вакансій DeepSeek на MokaHR отримує дані. Нічого не пише в базу.
# Запуск: Actions -> «Probe - DeepSeek jobs on MokaHR» -> Run workflow; результат - у журналі кроку.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "deepseek - сторінка DeepSeek на MokaHR; cn_careers - пошук сторінок найму інших китайських лабораторій"
        type: choice
        default: deepseek
        options: [deepseek, cn_careers]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cryptography
      - name: Probe - сторінки найму китайських лабораторій
        if: ${{ inputs.target == 'cn_careers' }}
        run: python -m tools.probe_cn_careers
      - name: Dry run - відкриті вакансії китайських лабораторій (без запису)
        if: ${{ !cancelled() && inputs.target == 'cn_careers' }}
        run: python -m collectors.cn_lab_jobs --dry-run
      - name: Probe MokaHR
        if: ${{ inputs.target != 'cn_careers' }}
        run: python -m tools.probe_mokahr
      - name: Dry run - збирач DeepSeek (без запису)
        if: ${{ !cancelled() && inputs.target != 'cn_careers' }}
        run: python -m collectors.jobs_deepseek --dry-run
